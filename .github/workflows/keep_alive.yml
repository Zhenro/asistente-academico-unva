name: Keep Alive Render Service

on:
  schedule:
    # Ejecutar cada 10 minutos
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping UNVA Assistant Service
        run: |
          TARGET_URL="${{ vars.RENDER_URL || 'https://asistente-academico-unva.onrender.com' }}"
          curl -s -f "${TARGET_URL}/api/health" || true
